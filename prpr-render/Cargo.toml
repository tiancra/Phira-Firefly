[package]
name = "prpr-render"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
macroquad-backend = ["dep:macroquad", "dep:miniquad"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }
nalgebra = { workspace = true }
once_cell = { workspace = true }
pollster = { workspace = true, optional = true }
raw-window-handle = "0.6"
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0"
tracing = { workspace = true }

# wgpu backend - wgsl feature for WGSL shader support
wgpu = { version = "24.0", optional = true, features = ["wgsl"] }

# macroquad compatibility backend (for fallback)
macroquad = { workspace = true, optional = true, default-features = false }
miniquad = { workspace = true, optional = true }

[lints]
workspace = true
